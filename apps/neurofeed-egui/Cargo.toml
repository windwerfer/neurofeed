[package]
name = "neurofeed-egui"
version.workspace = true
edition.workspace = true
description = "egui/eframe prototype of the NeuroFeed UI (desktop + web)"


[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
log.workspace = true
nf-core.workspace = true
nf-store.workspace = true
serde_json.workspace = true
web-time = "1"

[features]
default = ["native-audio"]
## Desktop chime through cpal (Linux needs libasound2-dev to build).
native-audio = ["dep:cpal"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "0.16", optional = true }
nf-store = { workspace = true, features = ["sqlite"] }
env_logger = "0.11"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "AudioContext", "BaseAudioContext", "AudioNode", "AudioParam", "AudioDestinationNode", "AudioScheduledSourceNode", "OscillatorNode", "GainNode"] }


[lints]
workspace = true
