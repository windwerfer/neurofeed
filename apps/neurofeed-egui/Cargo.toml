[package]
name = "neurofeed-egui"
version.workspace = true
license.workspace = true
edition.workspace = true
description = "egui/eframe prototype of the NeuroFeed UI (desktop + web)"


[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
# Monochrome emoji fonts: egui 0.37 no longer bundles ☰ ⏺ ⏸ by default.
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
log.workspace = true
nf-core.workspace = true
nf-audio = { workspace = true, features = ["decode"] }
nf-store.workspace = true
serde_json.workspace = true
web-time = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind", "std"] }

[features]
default = ["native-audio"]
## Desktop feedback audio through cpal (Linux needs libasound2-dev to build).
native-audio = ["dep:cpal"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nf-device = { workspace = true, features = ["ble", "osc", "lsl"] }
nf-ai.workspace = true
nf-mcp.workspace = true # dispatcher + bridge, no stdio server
png = "0.18"
cpal = { version = "0.18", optional = true }
nf-store = { workspace = true, features = ["sqlite"] }
env_logger = "0.11"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
nf-store = { workspace = true, features = ["indexeddb"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Window", "Location", "UrlSearchParams", "Element", "HtmlCanvasElement", "AudioContext", "BaseAudioContext", "AudioNode", "AudioParam", "AudioDestinationNode", "AudioScheduledSourceNode", "OscillatorNode", "GainNode", "ScriptProcessorNode", "AudioProcessingEvent", "AudioBuffer", "HtmlInputElement", "File", "FileList", "Blob"] }


[lints]
workspace = true
