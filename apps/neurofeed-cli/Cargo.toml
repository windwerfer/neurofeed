[package]
name = "neurofeed-cli"
description = "NeuroFeed automation: one-shot commands, batches, a JSON-lines server and the MCP server, over a headless Session or the running app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "neurofeed-cli"
path = "src/main.rs"

# Compatibility name: same CLI, defaults to the `mcp` subcommand.
[[bin]]
name = "neurofeed-mcp"
path = "src/bin/neurofeed-mcp.rs"

[dependencies]
nf-core.workspace = true
nf-mcp = { workspace = true, features = ["server"] }
nf-device = { workspace = true, features = ["ble", "osc", "lsl"] }
nf-ai.workspace = true
nf-store = { workspace = true, features = ["sqlite"] }
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time", "signal"] }
serde_json.workspace = true

[lints]
workspace = true
