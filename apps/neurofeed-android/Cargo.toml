[package]
name = "neurofeed-android"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Android wrapper: the neurofeed-egui app as a GameActivity cdylib, plus JNI glue (btleplug/droidplug init, system file picker, screen-on, lifecycle)."

[lib]
name = "neurofeed"
crate-type = ["cdylib"]
# Host builds are an empty library; everything is Android-only.

[target.'cfg(target_os = "android")'.dependencies]
neurofeed-egui = { path = "../neurofeed-egui" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "android-game-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-game-activity"] }
jni = "0.22"
ndk-context = "0.1"
android_logger = "0.14"
btleplug = "0.13.5"
log.workspace = true

[lints.rust]
# JNI entry points need `#[no_mangle] extern "system"` functions.
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"
