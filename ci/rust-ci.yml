# Gates for the Rust rewrite (AGENTS.md): fmt, clippy -D warnings (native +
# wasm), tests, release builds, trunk web build.
name: rust-ci
on:
  push:
    branches: [egui-prototype]
  pull_request:
    paths: ["crates/**", "apps/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust-ci.yml"]
  workflow_dispatch:
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libs (ALSA for cpal, D-Bus for btleplug)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p neurofeed-egui -p neurofeed-mcp
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Core crates stay wasm-clean
        run: cargo check --target wasm32-unknown-unknown -p nf-types -p nf-dsp -p nf-format -p nf-sim -p nf-feedback -p nf-store -p nf-core
      - run: cargo clippy --target wasm32-unknown-unknown -p neurofeed-egui -- -D warnings
      - uses: jetli/trunk-action@v0.5.0
        with:
          version: latest
      - run: trunk build --release
        working-directory: apps/neurofeed-egui
