[package]
name = "rust_lib_neurofeed"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
# Fork of eugenehp/muse-rs 0.1.0. Tag 0.1.2 is e4891ba.
muse-rs = { git = "https://github.com/windwerfer/muse-rs.git", tag = "0.1.2", default-features = false }
btleplug = "0.13.5"
jni = "0.22"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "net"] }
socket2 = "0.6"
anyhow = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"
env_logger = "0.11"
rand = "0.8"
android_logger = "0.14"
zstd = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1.3"
# OSC parser for Neurosity Crown/Notion
rosc = "0.11"
# EDF+ writer (own crate, third_party/edf_export) — raw-EEG history export.
edf_export = { path = "../third_party/edf_export" }

# REVE EEG foundation model (RLX CPU inference) — git dep (upstream, untouched).
reve-rs = { git = "https://github.com/eugenehp/reve-rs", rev = "9c8d8564b8793ce2a2b926f226c09eefb5e46781", default-features = false, features = ["rlx-cpu"] }
# The direct `rlx` dep is for the public `rlx::Device` type used when loading
# the encoder; feature `cpu` matches reveal-rs `rlx-cpu` so both unify onto one
# copy of rlx 0.2.
rlx = { version = "=0.2.14", default-features = false, features = ["cpu"] }

# Spur A CBraMod frozen encoder (CPU Candle path — pure Rust, mobile/desktop).
candle-core = "0.11.0"
candle-nn = "0.11.0"
rustfft = "6"
# Import resampling (foreign EDF / MU-01 220 Hz CSV → 256 Hz), anti-aliased.
rubato = "5"

# btleplug 0.13.5 is the crates.io release (deviceplug tag 0.13.5).
# It already removes the QueueStream item inside the lock, so the
# windwerfer 0.13.4-muse-1 patch is gone. muse-rs tag 0.1.2 still
# asks for 0.13.4; that unifies onto this copy. rlx-cpu stays patched.
[patch.crates-io]
rlx-cpu = { path = "../vendor/rlx-cpu-0.2.14" }

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time", "net", "process"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
