[package]
name = "nf-store"
version.workspace = true
edition.workspace = true
description = "Session history storage: trait + in-memory (wasm/tests) + SQLite (native) backends"

[features]
## Native SQLite backend (bundled libsqlite3; not for wasm).
sqlite = ["dep:rusqlite"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[lints]
workspace = true
