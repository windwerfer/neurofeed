[package]
name = "nf-mcp"
description = "L4: MCP server (rmcp) exposing every nf-core command as a tool. Native only."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nf-core.workspace = true
serde_json.workspace = true
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }

[dev-dependencies]
nf-format.workspace = true
nf-store = { workspace = true, features = ["sqlite"] }

[lints]
workspace = true
