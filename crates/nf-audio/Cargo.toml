[package]
name = "nf-audio"
description = "L1: feedback audio cues (pure data) and a stereo mixer that renders them. No device I/O, WASM-safe."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
schemars.workspace = true
symphonia = { version = "0.5", default-features = false, features = ["ogg", "vorbis", "mp3", "flac", "wav", "pcm"], optional = true }

[features]
default = ["decode"]
## Decode Ogg Vorbis / MP3 / FLAC / WAV into `Pcm` (pure Rust, symphonia).
decode = ["dep:symphonia"]

[lints]
workspace = true
