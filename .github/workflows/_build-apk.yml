name: Build release APK (reusable)

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the uploaded artifact.
        type: string
        required: true
      require-signing:
        description: Fail if release signing secrets are missing.
        type: boolean
        default: false
      keystore-b64:
        description: Base64 of a keystore to use instead of the repo secrets.
        type: string
        required: false
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEYSTORE_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

env:
  FLUTTER_VERSION: "3.41.7"
  RUST_VERSION: "1.97.1"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Android SDK components
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_VER=$(grep -oP 'val ndkVersion: String = "\K[0-9.]+' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")
          COMPILE_SDK=$(grep -oP 'val compileSdkVersion: Int = \K[0-9]+' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")
          SDKM=$(find "$SDK" -name sdkmanager -path '*cmdline-tools*' 2>/dev/null | sort -r | head -1)
          if [ -z "$SDKM" ]; then
            echo "::error::sdkmanager not found under $SDK"
            exit 1
          fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          PACKAGES=("platforms;android-${COMPILE_SDK}")
          if [ -n "$NDK_VER" ]; then
            PACKAGES+=("ndk;${NDK_VER}")
          fi
          "$SDKM" "${PACKAGES[@]}"

      - name: Fail if signing required but secrets missing
        if: ${{ inputs.require-signing }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are required. See .ai/release.md for setup."
            exit 1
          fi

      - name: Set up release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PASS=android123
          ALIAS=release
          if [ -n "$KEYSTORE_BASE64" ]; then
            PASS="$KEYSTORE_PASSWORD"
            ALIAS="$KEYSTORE_ALIAS"
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          elif [ -n "${{ inputs.keystore-b64 }}" ]; then
            echo "${{ inputs.keystore-b64 }}" | base64 -d > android/app/release-keystore.jks
          else
            keytool -genkeypair -v -keystore android/app/release-keystore.jks \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Muse ML CI, OU=CI, O=Muse ML, C=DE"
          fi
          printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$PASS" "$ALIAS" "$PASS" > android/key.properties

      - name: Build release APK
        shell: bash
        run: |
          printf '\norg.gradle.parallel=false\norg.gradle.caching=false\n' >> android/gradle.properties
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
