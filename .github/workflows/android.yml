# Android push CI (no secrets): unsigned per-ABI release APKs for arm64-v8a +
# armeabi-v7a and an x86_64 debug APK for the emulator, via scripts/build-android.sh.
# Signed release APKs: release.yml; reproducibility check: repro-android.yml.
# Versions match app/build.gradle.kts
# (compileSdk 35, NDK 27.2.12479018, JDK 17, minSdk 26).
name: android
on:
  push:
    branches: [main, android-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 27.2.12479018
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # versionName comes from the newest git tag
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK platform 35 + NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: x86_64 debug APK (emulator)
        run: scripts/build-android.sh --debug --abis x86_64
      - name: Unsigned release APKs (arm64-v8a, armeabi-v7a)
        run: scripts/build-android.sh
      - uses: actions/upload-artifact@v6
        with:
          name: neurofeed-android-apk
          path: dist/*.apk
          if-no-files-found: error
