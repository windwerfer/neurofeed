# Gates for the Rust rewrite (AGENTS.md): fmt, clippy -D warnings (native +
# wasm), tests, release builds, trunk web build.
name: rust-ci
on:
  push:
    branches: [egui-prototype, main]
  pull_request:
    paths: ["crates/**", "apps/**", "Cargo.toml", "Cargo.lock", "deny.toml", ".github/workflows/rust-ci.yml"]
  workflow_dispatch:
  # Weekly: new RustSec advisories appear for unchanged crates.
  schedule:
    - cron: "17 5 * * 1"
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
  native:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: System libs (ALSA for cpal, D-Bus for btleplug)
        run: scripts/ci-apt-install.sh libasound2-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p neurofeed-egui -p neurofeed-cli
  wasm:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Core crates stay wasm-clean
        run: cargo check --locked --target wasm32-unknown-unknown -p nf-types -p nf-dsp -p nf-format -p nf-sim -p nf-feedback -p nf-store -p nf-core
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p neurofeed-egui -- -D warnings
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: trunk@0.22.1
      # Trunk.toml; wasm-bindgen-cli is picked from Cargo.lock by trunk.
      - run: trunk build --release
        working-directory: apps/neurofeed-egui
      - uses: actions/upload-artifact@v6
        with:
          name: neurofeed-web
          path: apps/neurofeed-egui/dist/
          if-no-files-found: error
          retention-days: 14
