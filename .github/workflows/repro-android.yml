name: repro-android

on:
  workflow_dispatch:

jobs:
  setup-keystore:
    name: Generate shared test keystore
    runs-on: ubuntu-latest
    outputs:
      keystore-b64: ${{ steps.gen.outputs.keystore-b64 }}
    steps:
      - name: Generate keystore
        id: gen
        shell: bash
        run: |
          keytool -genkeypair -v -keystore /tmp/repro.jks \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android123 -keypass android123 \
            -dname "CN=Muse ML Repo, OU=CI, O=Muse ML, C=DE"
          echo "keystore-b64=$(base64 -w0 /tmp/repro.jks)" >> "$GITHUB_OUTPUT"

  build1:
    name: Build 1
    needs: setup-keystore
    uses: ./.github/workflows/_build-apk.yml
    with:
      artifact-name: apk-1
      keystore-b64: ${{ needs.setup-keystore.outputs.keystore-b64 }}
    secrets: inherit

  build2:
    name: Build 2
    needs: setup-keystore
    uses: ./.github/workflows/_build-apk.yml
    with:
      artifact-name: apk-2
      keystore-b64: ${{ needs.setup-keystore.outputs.keystore-b64 }}
    secrets: inherit

  compare:
    name: Compare APKs
    needs: [build1, build2]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: apk-1
          path: a
      - uses: actions/download-artifact@v7
        with:
          name: apk-2
          path: b
      - name: Compare checksums
        shell: bash
        run: |
          H1=$(sha256sum a/app-release.apk | cut -d' ' -f1)
          H2=$(sha256sum b/app-release.apk | cut -d' ' -f1)
          echo "build1: $H1"
          echo "build2: $H2"
          if [ "$H1" != "$H2" ]; then
            echo "::error::The two builds are NOT byte-identical."
            exit 1
          fi
          echo "OK: the two independent builds are byte-identical."
