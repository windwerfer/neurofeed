name: release-linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to attach the archives to (empty = build only, no upload)
        required: false
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.7"
  RUST_VERSION: "1.97.1"

jobs:
  linux:
    name: Build Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Init model-engine submodules
        run: git submodule update --init third_party/reve-rs third_party/luna-rs

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake clang pkg-config libgtk-3-dev liblzma-dev \
            libdbus-1-dev libglib2.0-dev libasound2-dev libopus-dev \
            libogg-dev libvorbis-dev libflac-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Get version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -n "$TAG" ]; then
            BASE="${TAG#v}"
            VERSION="${BASE%%[-_]*}"
          else
            VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
            VERSION="${VERSION%%+*}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Linux release
        shell: bash
        env:
          # flutter_soloud bundles glibc-2.43-precompiled Xiph libs; link the
          # ubuntu-24.04 system ones instead (runners have an older glibc).
          TRY_SYSTEM_LIBS_FIRST: "1"
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package tarball
        shell: bash
        run: |
          ./scripts/package-linux.sh \
            build/linux/x64/release/bundle \
            "muse_ml-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz"

      - name: Package AppImage (best effort)
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          ./scripts/package-linux.sh \
            build/linux/x64/release/bundle \
            "" \
            "muse_ml-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"

      - name: Upload to release
        if: ${{ github.event.release.tag_name != '' || inputs.tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          gh release upload "$TAG" "muse_ml-${VERSION}-linux-x86_64.tar.gz" --clobber
          if [ -f "muse_ml-${VERSION}-linux-x86_64.AppImage" ]; then
            gh release upload "$TAG" "muse_ml-${VERSION}-linux-x86_64.AppImage" --clobber
          fi
