# Reusable: build per-ABI Android APKs with scripts/build-android.sh.
# Used by release.yml (signed with the repo keystore) and repro-android.yml (twice, throwaway key).
# Toolchains are pinned here so two runs of one commit produce byte-identical APKs.
name: android-apk (reusable)
on:
  workflow_call:
    inputs:
      artifact-name: { type: string, required: true }
      version: { type: string, required: false, default: "" }
      abis: { type: string, required: false, default: "arm64-v8a,armeabi-v7a" }
      require-signing: { type: boolean, required: false, default: false }
      keystore-b64:
        description: Throwaway keystore (password android123, alias release) instead of the repo secrets.
        type: string
        required: false
        default: ""
    secrets:
      KEYSTORE_BASE64: { required: false }
      KEYSTORE_PASSWORD: { required: false }
      KEYSTORE_ALIAS: { required: false }
      KEY_PASSWORD: { required: false }
env:
  RUST_VERSION: "1.99.1"
  NDK_VERSION: 27.2.12479018
  BUILD_TOOLS: 35.0.0
  CARGO_NDK_VERSION: 4.1.2
  CARGO_TERM_COLOR: always
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK platform 35, build-tools, NDK (pinned)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@${{ env.CARGO_NDK_VERSION }}
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      - name: Fail if signing is required but the secrets are missing
        if: ${{ inputs.require-signing && inputs.keystore-b64 == '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEYSTORE_ALIAS / KEY_PASSWORD secrets are required (docs/release.md)."
            exit 1
          fi
      - name: Build APKs
        env:
          KEYSTORE_BASE64: ${{ inputs.keystore-b64 != '' && inputs.keystore-b64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ inputs.keystore-b64 != '' && 'android123' || secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ inputs.keystore-b64 != '' && 'release' || secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ inputs.keystore-b64 != '' && 'android123' || secrets.KEY_PASSWORD }}
        run: |
          args=(--abis "${{ inputs.abis }}")
          [ -n "${{ inputs.version }}" ] && args+=(--version "${{ inputs.version }}")
          scripts/build-android.sh "${args[@]}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/*.apk
          if-no-files-found: error
