# Release packaging for every platform; assets are attached to the GitHub release.
#   release published          -> build everything, upload to that release
#   workflow_dispatch tag=0.64.0  -> same for an existing release (dry-run = build only)
# Local equivalents: scripts/build-android.sh, scripts/package-{linux,flatpak,macos,web}.sh,
# scripts/package-windows.ps1 (docs/release.md).
name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach to (e.g. 0.64.0); empty = version from git describe, no upload
        required: false
        type: string
      dry-run:
        description: Build everything but do not upload
        required: false
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false
env:
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: always
jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      upload: ${{ steps.v.outputs.upload }}
      # Tag when set, else this run's SHA — so workflow_dispatch from main can
      # build the tagged source and upload to an existing release.
      checkout: ${{ steps.v.outputs.checkout }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags for scripts/version.sh
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DRY: ${{ inputs.dry-run }}
        run: |
          # One version for every job: the release tag, else scripts/version.sh (git describe / Cargo.toml).
          if [ -n "$TAG" ]; then V="${TAG#v}"; else V=$(scripts/version.sh); fi
          UPLOAD=false
          if [ -n "$TAG" ] && [ "$DRY" != "true" ]; then
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then UPLOAD=true
            else echo "::warning::no GitHub release '$TAG'; building without upload"; fi
          fi
          CHECKOUT="${TAG:-$GITHUB_SHA}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "upload=$UPLOAD" >> "$GITHUB_OUTPUT"
          echo "checkout=$CHECKOUT" >> "$GITHUB_OUTPUT"
          echo "version=$V tag=$TAG upload=$UPLOAD checkout=$CHECKOUT"

  android:
    needs: meta
    uses: ./.github/workflows/_android-apk.yml
    with:
      artifact-name: release-android
      version: ${{ needs.meta.outputs.version }}
      require-signing: true
      ref: ${{ needs.meta.outputs.checkout }}
    secrets: inherit

  linux:
    needs: meta
    # Oldest supported hosted runner: the binary needs glibc >= 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.meta.outputs.checkout }}" }
      # Script lives on main; a workflow_dispatch that builds a tagged commit
      # (e.g. 0.64.0) would otherwise 127 because the tag predates the file.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .ci-workflow
          sparse-checkout: scripts/ci-apt-install.sh
          sparse-checkout-cone-mode: false
      - name: Install packaging deps
        run: |
          .ci-workflow/scripts/ci-apt-install.sh libasound2-dev libdbus-1-dev pkg-config libfuse2 file desktop-file-utils
          rm -rf .ci-workflow
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set via with:
        with: { toolchain: "${{ env.RUST_VERSION }}" }
      - run: scripts/package-linux.sh --version "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v6
        with: { name: release-linux, path: "dist/*", if-no-files-found: error }

  flatpak:
    needs: meta
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, ref: "${{ needs.meta.outputs.checkout }}" }
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Offline cargo sources + metainfo release entry
        run: |
          python3 -m pip install --user aiohttp tomlkit 2>/dev/null || { dnf install -y python3-aiohttp python3-tomlkit || true; }
          scripts/package-flatpak.sh --version "${{ needs.meta.outputs.version }}" --sources-only
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: neurofeed-${{ needs.meta.outputs.version }}-x86_64.flatpak
          manifest-path: flatpak/org.windwerfer.neurofeed.yml
          cache-key: flatpak-neurofeed-25.08-${{ hashFiles('Cargo.lock') }}
          upload-artifact: false
      - uses: actions/upload-artifact@v6
        with: { name: release-flatpak, path: "*.flatpak", if-no-files-found: error }

  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.meta.outputs.checkout }}" }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set via with:
        with: { toolchain: "${{ env.RUST_VERSION }}", targets: x86_64-pc-windows-msvc }
      - run: pwsh scripts/package-windows.ps1 -Version "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v6
        with: { name: release-windows, path: "dist/*", if-no-files-found: error }

  macos:
    needs: meta
    # Apple Silicon runner; builds arm64 + x86_64 and lipo's a universal .app/DMG.
    # macos-14 was retired 2026-11-02; jobs on that label are cancelled at queue
    # time ("macos-14-arm64-us-default is not supported").
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.meta.outputs.checkout }}" }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set via with:
        with: { toolchain: "${{ env.RUST_VERSION }}", targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - run: scripts/package-macos.sh --version "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v6
        with: { name: release-macos, path: "dist/*", if-no-files-found: error }

  web:
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ needs.meta.outputs.checkout }}" }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set via with:
        with: { toolchain: "${{ env.RUST_VERSION }}", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: trunk@0.22.1 }
      - run: scripts/package-web.sh --version "${{ needs.meta.outputs.version }}"
      - uses: actions/upload-artifact@v6
        with: { name: release-web, path: "dist/*", if-no-files-found: error }

  # There is no matrix, so strategy.fail-fast does not apply; platform jobs already
  # run in parallel. A *cancelled* needed job (retired runner, etc.) still skips
  # dependents unless this job uses always(). Attach whatever built, then fail
  # the workflow if a platform dropped.
  upload:
    needs: [meta, android, linux, flatpak, windows, macos, web]
    if: ${{ always() && needs.meta.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with: { pattern: "release-*", path: out, merge-multiple: true }
      - name: Checksums
        run: cd out && sha256sum * | tee SHA256SUMS.txt && { echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload to the release
        if: needs.meta.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.meta.outputs.tag }}" out/* --clobber -R "$GITHUB_REPOSITORY"
      - if: needs.meta.outputs.upload != 'true'
        run: echo "Dry run / no release - nothing uploaded."
      - name: Fail if a platform job did not succeed
        if: ${{ needs.android.result != 'success' || needs.linux.result != 'success' || needs.flatpak.result != 'success' || needs.windows.result != 'success' || needs.macos.result != 'success' || needs.web.result != 'success' }}
        run: |
          echo "::error::One or more platform jobs did not succeed (android=${{ needs.android.result }}, linux=${{ needs.linux.result }}, flatpak=${{ needs.flatpak.result }}, windows=${{ needs.windows.result }}, macos=${{ needs.macos.result }}, web=${{ needs.web.result }}). Any artifacts that did build were still uploaded."
          exit 1
