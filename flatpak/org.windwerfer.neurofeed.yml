# Plain Rust Flatpak manifest. Offline cargo sources: flatpak/cargo-sources.json is generated
# from Cargo.lock by scripts/package-flatpak.sh (flatpak-cargo-generator); not committed.
id: org.windwerfer.neurofeed
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: neurofeed
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --share=network # Neurosity Crown, LSL / OSC streaming
  - --allow=bluetooth
  - --system-talk-name=org.bluez # Muse over BLE (btleplug)
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/neurofeed/cargo
    CARGO_NET_OFFLINE: "true"
modules:
  - name: neurofeed
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked -p neurofeed-egui
      - install -Dm755 target/release/neurofeed-egui /app/bin/neurofeed
      - install -Dm644 flatpak/org.windwerfer.neurofeed.desktop /app/share/applications/org.windwerfer.neurofeed.desktop
      - install -Dm644 flatpak/org.windwerfer.neurofeed.metainfo.xml /app/share/metainfo/org.windwerfer.neurofeed.metainfo.xml
      - install -Dm644 assets/neurofeed_icon.png /app/share/icons/hicolor/512x512/apps/org.windwerfer.neurofeed.png
    sources:
      - type: dir
        path: ..
        skip: [target, dist, .flatpak-builder, build-dir, repo, log]
      - cargo-sources.json
