app-id: org.windwerfer.neurofeed
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm20
command: neurofeed
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --system-talk-name=org.bluez
  - --env=GTK_USE_PORTAL=1
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - /share/aclocal
modules:
  - name: libogg
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --libdir=/app/lib
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz
        sha256: 0eb4b4b9420a0f51db142ba3f9c64b333f826532dc0f48c6410ae51f4799b664
  - name: opus
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --libdir=/app/lib
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz
        sha256: 65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1
  - name: libvorbis
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --libdir=/app/lib
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.gz
        sha256: 0e982409a9c3fc82ee06e08205b1355e5c6aa4c36bca58146ef399621b0ce5ab
  - name: flac
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_PROGRAMS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_TESTING=OFF
      - -DBUILD_DOCS=OFF
      - -DCMAKE_INSTALL_LIBDIR=lib
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/flac/flac-1.4.3.tar.xz
        sha256: 6c58e69cd22348f441b861092b825e591d0b822e106de6eb0ee4d05d27205b70
  - name: neurofeed
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm20/bin:/run/build/neurofeed/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        TRY_SYSTEM_LIBS_FIRST: '1'
        CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    build-commands:
      - sed -i 's|VERSION_PLACEHOLDER|__VERSION__|; s|DATE_PLACEHOLDER|__DATE__|' flatpak/org.windwerfer.neurofeed.metainfo.xml
      - flutter build linux --release --no-pub
      - install -D $BUNDLE_PATH/neurofeed /app/bin/neurofeed
      - cp -r $BUNDLE_PATH/lib /app/bin/lib
      - cp -r $BUNDLE_PATH/data /app/bin/data
      - install -Dm644 flatpak/org.windwerfer.neurofeed.desktop /app/share/applications/org.windwerfer.neurofeed.desktop
      - install -Dm644 flatpak/org.windwerfer.neurofeed.metainfo.xml /app/share/metainfo/org.windwerfer.neurofeed.metainfo.xml
      - |
        for size in 16 24 32 48 64 128 256 512; do
          install -Dm644 "linux/icons/hicolor/${size}x${size}/apps/org.windwerfer.neurofeed.png" \
            "/app/share/icons/hicolor/${size}x${size}/apps/org.windwerfer.neurofeed.png"
        done
    sources:
      - type: git
        url: https://github.com/windwerfer/neurofeed.git
        commit: COMMIT_PLACEHOLDER
        disable-submodules: true
      - type: patch
        path: flatpak/cargokit/run_build_tool.sh.patch
        dest: rust_builder/cargokit
      - type: git
        url: https://github.com/flutter/flutter.git
        tag: '3.41.7'
        dest: flutter
        disable-submodules: true
    modules:
      - generated/modules/rustup-1.97.1.json
