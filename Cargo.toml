# NeuroFeed Rust workspace (repo root).
[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]
# Flutter-era code kept as reference until migrated.
exclude = ["rust", "rust_builder", "third_party", "vendor", "feedback_gym"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
nf-types = { path = "crates/nf-types" }
nf-sim = { path = "crates/nf-sim" }
nf-core = { path = "crates/nf-core" }
nf-mcp = { path = "crates/nf-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
log = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
