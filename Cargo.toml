# NeuroFeed Rust workspace (repo root).
[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]
# Patched upstream (vendor) and the Python gym are not workspace crates.
exclude = ["vendor", "feedback_gym", ".local/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
nf-types = { path = "crates/nf-types" }
nf-dsp = { path = "crates/nf-dsp" }
nf-format = { path = "crates/nf-format" }
nf-sim = { path = "crates/nf-sim" }
nf-feedback = { path = "crates/nf-feedback" }
nf-core = { path = "crates/nf-core" }
nf-mcp = { path = "crates/nf-mcp", default-features = false }
nf-store = { path = "crates/nf-store" }
nf-device = { path = "crates/nf-device", default-features = false }
nf-import = { path = "crates/nf-import" }
nf-ai = { path = "crates/nf-ai" }
nf-audio = { path = "crates/nf-audio", default-features = false }
edf_export = { path = "crates/edf_export" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
log = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"
too_many_lines = "warn"

# rlx-cpu 0.2.19 with its default BLAS feature disabled (pure Rust kernels).
[patch.crates-io]
rlx-cpu = { path = "vendor/rlx-cpu-0.2.19" }

# Quick local Android iteration builds only (scripts/build-android.sh --fast).
# Release, CI and reproducible builds keep using the plain release profile.
[profile.android-fast]
inherits = "release"
opt-level = 2
debug = false
lto = false
codegen-units = 256
incremental = true
