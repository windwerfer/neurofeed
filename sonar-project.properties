# SonarQube Cloud, CI-based analysis (.github/workflows/sonarcloud.yml).
# Property names: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/languages/rust
# and https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/test-coverage-parameters
sonar.projectKey=windwerfer_neurofeed
sonar.organization=windwerfer

# SonarCloud's analysis-scope UX scans the whole repo and ignores sonar.sources/sonar.tests.
# Vendored upstream code, build output, local-only data, generated assets, and tests.
# Do NOT list clippy-report.json / lcov.info here: excluded files are invisible to the
# report importers ("No Clippy/LCOV report files found").
sonar.exclusions=vendor/**,target/**,.local/**,**/dist/**,log/**,assets/**,.ai/**,.grok/**,**/tests/**,**/test_*.py
# Coverage comes only from cargo llvm-cov (Rust unit + integration tests). Python research
# tooling, CI/build scripts, and the Android Java/Kotlin shell have no coverage import, so
# they are excluded from the coverage metric (still analyzed for bugs/vulnerabilities).
sonar.coverage.exclusions=**/*.py,scripts/**,.devcontainer/**,.github/**,apps/neurofeed-android/**,flatpak/**,**/build.rs
# Translation tables repeat by design.
sonar.cpd.exclusions=apps/neurofeed-egui/locales/**

# Written by the workflow: cargo clippy --message-format=json / cargo llvm-cov --lcov.
sonar.rust.clippyReport.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=lcov.info
