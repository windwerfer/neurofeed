# SonarQube Cloud, CI-based analysis (.github/workflows/sonarcloud.yml).
# Property names: https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/languages/rust
# and https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/test-coverage/test-coverage-parameters
sonar.projectKey=windwerfer_neurofeed
sonar.organization=windwerfer

sonar.sources=.
sonar.tests=.
# Rust integration tests (crates/*/tests, apps/*/tests) and the Python gym tests.
sonar.test.inclusions=**/tests/**,**/test_*.py
# Vendored upstream code, build output, local-only data, generated assets, and the tests (indexed above).
sonar.exclusions=vendor/**,target/**,.local/**,**/dist/**,log/**,assets/**,.ai/**,.grok/**,**/tests/**,**/test_*.py,clippy-report.json,lcov.info
# Translation tables repeat by design.
sonar.cpd.exclusions=apps/neurofeed-egui/locales/**

# Written by the workflow: cargo clippy --message-format=json / cargo llvm-cov --lcov.
sonar.rust.clippyReport.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=lcov.info
